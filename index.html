<html>
<head>
	<meta charset="utf-8">
	<title>card Oracle</title>
	<meta name="description" content="a tool for quickly searching for cardboard in multiple tabs at the same time">
	<meta name="author" content="Steven">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="//fonts.googleapis.com/css?family=Raleway:400,300,600" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/skeleton/skeleton.css">
	<link rel="stylesheet" href="css/oracle.css">
	<!--link rel="icon" type="image/png" href="images/favicon.png"-->

	<script type="text/javascript">
	
	function performSearch() {
	
		const tcgplayer = document.getElementById('tcgplayer');
		const facetoface = document.getElementById('facetoface');
		const fourohonegames = document.getElementById('fourohonegames');
		const chimera = document.getElementById('chimera');
		const jjs = document.getElementById('jjs');
		const ebay = document.getElementById('ebay');
		const scg = document.getElementById('scg');
		const atlas = document.getElementById('atlas');
		const pc = document.getElementById('pc');
		const limitless = document.getElementById('limitless');
		const scryfall = document.getElementById('scryfall');
		const xj = document.getElementById('xj');
		const psg = document.getElementById('psg');
		const ieightoheight = document.getElementById('ieightoheight');
		const fiftyc = document.getElementById('fiftyc');
		const tcgr = document.getElementById('tcgr');
		const darkfox = document.getElementById('darkfox');
		const skyfox = document.getElementById('skyfox');
		const kanzen = document.getElementById('kanzen');
		const dollys = document.getElementById('dollys');
		const kanata = document.getElementById('kanata');
		const ccac = document.getElementById('ccac');
		const snapcastermtg = document.getElementById('snapcastermtg');
		
		var searchTerm = 
			encodeURIComponent(document.getElementById('searchQuery').value);
		
		window.localStorage.setItem('tcgplayer', tcgplayer.checked);
		window.localStorage.setItem('facetoface', facetoface.checked);
		window.localStorage.setItem('fourohonegames', fourohonegames.checked);
		window.localStorage.setItem('chimera', chimera.checked);
		window.localStorage.setItem('jjs', jjs.checked);
		window.localStorage.setItem('ebay', ebay.checked);
		window.localStorage.setItem('scg', scg.checked);
		window.localStorage.setItem('atlas', atlas.checked);
		window.localStorage.setItem('pc', pc.checked);
		window.localStorage.setItem('limitless', limitless.checked);
		window.localStorage.setItem('scryfall', scryfall.checked);
		window.localStorage.setItem('xj', xj.checked);
		window.localStorage.setItem('psg', psg.checked);
		window.localStorage.setItem('ieightoheight', ieightoheight.checked);
		window.localStorage.setItem('fiftyc', fiftyc.checked);
		window.localStorage.setItem('tcgr', tcgr.checked);
		window.localStorage.setItem('darkfox', darkfox.checked);
		window.localStorage.setItem('skyfox', skyfox.checked);
		window.localStorage.setItem('kanzen', kanzen.checked);
		window.localStorage.setItem('dollys', dollys.checked);
		window.localStorage.setItem('kanata', kanata.checked);
		window.localStorage.setItem('ccac', ccac.checked);
		window.localStorage.setItem('snapcastermtg', snapcastermtg.checked);

		if (tcgplayer.checked) {
			window.open(
				'https://www.tcgplayer.com/search/all/product?q=' + searchTerm + '&view=grid', 
				'tcgpWindow'
			);
		}

		if (facetoface.checked) {
			window.open(
				'https://facetofacegames.com/search?q=' + searchTerm, 
				'faceWindow'
			);
		}

		if (fourohonegames.checked) {
			window.open(
				'https://store.401games.ca/pages/search-results?q=' + searchTerm, 
				'fourOhOneWindow'
			);
		}

		if (chimera.checked) {
			window.open(
				'https://chimeragamingonline.com/search?type=product&options%5Bprefix%5D=last&q=' + searchTerm, 
				'chimeraWindow'
			);
		}

		if (jjs.checked) {
			window.open(
				'https://jjcards.crystalcommerce.com/products/search?q=' + searchTerm, 
				'jjWindow'
			);
		}

		if (ebay.checked) {
			window.open(
				'https://www.ebay.ca/sch/i.html?_from=R40&_nkw=' + searchTerm + '&_sacat=0&rt=nc&LH_Sold=1&LH_Complete=1', 
				'ebayWindow'
			);
		}

		if (scg.checked) {
			window.open(
				'https://starcitygames.com/search/?search_query=' + searchTerm + '&sort=score', 
				'scgWindow'
			);
		}

		if (atlas.checked) {
			window.open(
				'https://www.atlascollectables.com/products/search?q=' + searchTerm, 
				'atlasWindow'
			);
		}

		if (pc.checked) {
			window.open(
				'https://www.pricecharting.com/search-products?q=' + searchTerm + '&type=prices', 
				'pcWindow'
			);
		}

		if (limitless.checked) {
			window.open(
				'https://limitlesstcg.com/cards?q=' + searchTerm, 
				'limitlessWindow'
			);
		}

		if (scryfall.checked) {
			window.open(
				'https://scryfall.com/search?q=' + searchTerm, 
				'scryfallWindow'
			);
		}

		if (xj.checked) {
			window.open(
				'https://www.expeditionjeux.com/products/search?q=' + searchTerm + '&c=1', 
				'xjWindow'
			);
		}

		if (psg.checked) {
			window.open(
				'https://www.perfectspheregames.com/search?type=product&q=' + searchTerm, 
				'psgWindow'
			);
		}

		if (ieightoheight.checked) {
			window.open(
				'https://www.ideal808.com/SearchResults?search=' + searchTerm, 
				'i808Window'
			);
		}

		if (fiftyc.checked) {
			window.open(
				'https://50cards.shop/pages/search-results-page?q=' + searchTerm, 
				'fiftycWindow'
			);
		}

		if (tcgr.checked) {
			window.open(
				'https://tcgrepublic.com/product/text_search.html?q=' + searchTerm, 
				'tcgrWindow'
			);
		}

		if (darkfox.checked) {
			window.open(
				'https://www.darkfoxtcg.com/search.php?search_query=' + searchTerm, 
				'darkfoxWindow'
			);
		}

		if (skyfox.checked) {
			window.open(
				'https://skyfoxgames.com/search?type=product&options%5Bprefix%5D=last&q=' + searchTerm, 
				'skyfoxWindow'
			);
		}

		if (kanzen.checked) {
			window.open(
				'https://kanzengames.com/search?q=' + searchTerm, 
				'kanzenWindow'
			);
		}

		if (dollys.checked) {
			window.open(
				'https://www.dollys.ca/products/search?q=' + searchTerm, 
				'dollysWindow'
			);
		}

		if (kanata.checked) {
            window.open(
                'https://kanatacg.crystalcommerce.com/products/search?query=' + searchTerm, 
                'kanataWindow'
            );
        }

		if (ccac.checked) {
            window.open(
                'https://atlascollectables-admin.crystalcommerce.com/inventory/update?utf8=%E2%9C%93&form_action=&page=1&per_page_number=200&in_category_tree_by_id=&search=' + searchTerm + '&commit=Go', 
                'ccacWindow'
            );
        }

		if (snapcastermtg.checked) {
            window.open(
                'https://www.snapcaster.ca/singles/magic-the-gathering?q=' + searchTerm + '&sortBy=price-asc', 
                'snapcastermtgWindow'
            );
        }
	}
	
	window.addEventListener('load', () => {
		if (window.localStorage.getItem('snapcastermtg') === null) {
			// initialize local storage
			window.localStorage.setItem('tcgplayer', false);
			window.localStorage.setItem('facetoface', false);
			window.localStorage.setItem('fourohonegames', false);
			window.localStorage.setItem('chimera', false);
			window.localStorage.setItem('jjs', false);
			window.localStorage.setItem('ebay', false);
			window.localStorage.setItem('scg', false);
			window.localStorage.setItem('atlas', false);
			window.localStorage.setItem('pc', false);
			window.localStorage.setItem('limitless', false);
			window.localStorage.setItem('scryfall', false);
			window.localStorage.setItem('xj', false);
			window.localStorage.setItem('psg', false);
			window.localStorage.setItem('ieightoheight', false);
			window.localStorage.setItem('fiftyc', false);
			window.localStorage.setItem('tcgr', false);
			window.localStorage.setItem('darkfox', false);
			window.localStorage.setItem('skyfox', false);
			window.localStorage.setItem('kanzen', false);
			window.localStorage.setItem('dollys', false);
			window.localStorage.setItem('kanata', false);
			window.localStorage.setItem('ccac', false);
			window.localStorage.setItem('snapcastermtg', false);
		}
		
		else {
			const tcgplayer = document.getElementById('tcgplayer');
			const facetoface = document.getElementById('facetoface');
			const fourohonegames = document.getElementById('fourohonegames');
			const chimera = document.getElementById('chimera');
			const jjs = document.getElementById('jjs');
			const ebay = document.getElementById('ebay');
			const scg = document.getElementById('scg');
			const atlas = document.getElementById('atlas');
			const pc = document.getElementById('pc');
			const limitless = document.getElementById('limitless');
			const scryfall = document.getElementById('scryfall');
			const xj = document.getElementById('xj');
			const psg = document.getElementById('psg');
			const ieightoheight = document.getElementById('ieightoheight');
			const fiftyc = document.getElementById('fiftyc');
			const tcgr = document.getElementById('tcgr');
			const darkfox = document.getElementById('darkfox');
			const skyfox = document.getElementById('skyfox');
			const kanzen = document.getElementById('kanzen');
			const dollys = document.getElementById('dollys');
			const kanata = document.getElementById('kanata');
			const ccac = document.getElementById('ccac');
			const snapcastermtg = document.getElementById('snapcastermtg');
			
			tcgplayer.checked = ('true' === window.localStorage.getItem('tcgplayer'));
			facetoface.checked = ('true' === window.localStorage.getItem('facetoface'));
			fourohonegames.checked = ('true' === window.localStorage.getItem('fourohonegames'));
			chimera.checked = ('true' === window.localStorage.getItem('chimera'));
			jjs.checked = ('true' === window.localStorage.getItem('jjs'));
			ebay.checked = ('true' === window.localStorage.getItem('ebay'));
			scg.checked = ('true' === window.localStorage.getItem('scg'));
			atlas.checked = ('true' === window.localStorage.getItem('atlas'));
			pc.checked = ('true' === window.localStorage.getItem('pc'));
			limitless.checked = ('true' === window.localStorage.getItem('limitless'));
			scryfall.checked = ('true' === window.localStorage.getItem('scryfall'));
			xj.checked = ('true' === window.localStorage.getItem('xj'));
			psg.checked = ('true' === window.localStorage.getItem('psg'));
			ieightoheight.checked = ('true' === window.localStorage.getItem('ieightoheight'));
			fiftyc.checked = ('true' === window.localStorage.getItem('fiftyc'));
			tcgr.checked = ('true' === window.localStorage.getItem('tcgr'));
			darkfox.checked = ('true' === window.localStorage.getItem('darkfox'));
			skyfox.checked = ('true' === window.localStorage.getItem('skyfox'));
			kanzen.checked = ('true' === window.localStorage.getItem('kanzen'));
			dollys.checked = ('true' === window.localStorage.getItem('dollys'));
			kanata.checked = ('true' === window.localStorage.getItem('kanata'));
			ccac.checked = ('true' === window.localStorage.getItem('ccac'));
			snapcastermtg.checked = ('true' === window.localStorage.getItem('snapcastermtg'));
		}
	});
	</script>
</head>
<body>
	<div class="container">
		<h1>card Oracle</h1>
		<form onsubmit="performSearch(); return false;">
			<div class="row">
				<label for="searchQuery">your query for the oracle</label>
				<input class="u-full-width" type="text" placeholder="name a card..." id="searchQuery">
			</div>
			<div class="row">
				<div class="six columns">
					<label class="option">
						<input type="checkbox" id="atlas">
						<span class="label-body">atlas collectables</span>
					</label>
					<label class="option">
						<input type="checkbox" id="chimera">
						<span class="label-body">chimera</span>
					</label>
					<label class="option">
						<input type="checkbox" id="jjs">
						<span class="label-body">j&j cards and collectables</span>
					</label>
					<label class="option">
						<input type="checkbox" id="tcgplayer">
						<span class="label-body">tcg player</span>
					</label>
					<label class="option">
						<input type="checkbox" id="pc">
						<span class="label-body">price charting</span>
					</label>
					<label class="option">
						<input type="checkbox" id="ebay">
						<span class="label-body">ebay (sold listings)</span>
					</label>
					<label class="option">
						<input type="checkbox" id="tcgr">
						<span class="label-body">tcg republic</span>
					</label>
					<label class="option">
						<input type="checkbox" id="scg">
						<span class="label-body">star city games</span>
					</label>
					<label class="option">
						<input type="checkbox" id="kanzen">
						<span class="label-body">kanzen games</span>
					</label>
					<label class="option">
						<input type="checkbox" id="dollys">
						<span class="label-body">dolly's</span>
					</label>
					<label class="option">
						<input type="checkbox" id="ccac">
						<span class="label-body">crystal commerce (atlas)</span>
					</label>
					<label class="option">
						<input type="checkbox" id="snapcastermtg">
						<span class="label-body">snapcaster (mtg)</span>
					</label>
				</div>
				<div class="six columns">
					<label class="option">
						<input type="checkbox" id="fourohonegames">
						<span class="label-body">401 games</span>
					</label>
					<label class="option">
						<input type="checkbox" id="facetoface">
						<span class="label-body">face to face</span>
					</label>
					<label class="option">
						<input type="checkbox" id="scryfall">
						<span class="label-body">scryfall</span>
					</label>
					<label class="option">
						<input type="checkbox" id="limitless">
						<span class="label-body">limitless tcg</span>
					</label>
					<label class="option">
						<input type="checkbox" id="xj">
						<span class="label-body">expedition jeux</span>
					</label>
					<label class="option">
						<input type="checkbox" id="ieightoheight">
						<span class="label-body">ideal808</span>
					</label>
					<label class="option">
						<input type="checkbox" id="psg">
						<span class="label-body">perfect sphere games</span>
					</label>
					<label class="option">
						<input type="checkbox" id="darkfox">
						<span class="label-body">darkfox tcg</span>
					</label>
					<label class="option">
						<input type="checkbox" id="skyfox">
						<span class="label-body">skyfox games</span>
					</label>
					<label class="option">
						<input type="checkbox" id="fiftyc">
						<span class="label-body">50cards</span>
					</label>
					<label class="option">
						<input type="checkbox" id="kanata">
						<span class="label-body">wizard's tower / kanatacg</span>
					</label>
				</div>
			</div>
			<div class="row">
				<input class="button-primary u-full-width" type="submit" value="Search">
			</div>
		</form>
	</div>
</body>
</html>
